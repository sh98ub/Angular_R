<h2>Student Registration form</h2>
<form #studentForm="ngForm" (ngSubmit)="submitForm(studentForm)">

  <label>Name</label>
<input type="text" name="name" [(ngModel)]="student.name">
<br><br>


  <label>Email:</label>
  <input
    type="email"
    name="email"
    [(ngModel)]="student.email"
    required
  >

  <br><br>

  <label>Age:</label>
  <input
    type="number"
    name="age"
    [(ngModel)]="student.age"
    required
  >

  <br><br>

  <button type="submit" [disabled]="studentForm.invalid">
    Register
  </button>
</form>
